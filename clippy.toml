# Clippy's in-test allowances only cover #[test] bodies; integration-test files use the one blanket allow documented in docs/conventions.md.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "D3: iteration order is not deterministic; use BTreeMap or a sorted Vec" },
    { path = "std::collections::HashSet", reason = "D3: iteration order is not deterministic; use BTreeSet or a sorted Vec" },
]

# sqrt and mul_add stay allowed: IEEE 754 requires them correctly rounded, so they match across platforms.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "D8: inject a Clock; SystemClock in wolluf-app is the single allowed site" },
    { path = "f64::exp", reason = "D3: platform libm differs; use the libm crate" },

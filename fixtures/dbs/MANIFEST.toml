# Generated by `cargo xtask fixtures dbs --corpus <osu! dir>` (spec 002 T16); do not edit.

[selection]
rule = "Candidates are osu!.db entries with a valid md5, deduplicated and sorted by original md5. Requirements, in order: a beatmap with an empty-name score, one with a ScoreV2 score, one with a positive online id, one with at least 2 scores, one member of each of the first 2 collections (file order) that has one in osu!.db, every mode 0-3, mania keymodes 4 and 7, one entry with timing points, one entry per ranked status seen. An unmet requirement takes the candidate with the fewest scores, then the lowest md5; the rest is filled the same way up to 12 entries. Scores are all scores of the selected beatmaps (at most 40). Collections keep their selected members plus the first 2 members that have no osu!.db entry at all (dangling references, as every pilot collection member is)."
beatmaps = 12
scores = 5
collections = 2

[anonymization]
rule = "md5s (beatmap and replay) become md5(\"wolluf-fixture:<n>\"), numbered from 1 in output order, consistent across the three files. Strings become <field>-<n> with n the beatmap number (absent and empty strings are kept); collection names become collection-<k>. Players become player-01.. by first appearance, the empty name is kept; the osu!.db header name becomes fixture. Positive online ids become 1000+k and the rest 0; positive beatmap and set ids become 1000+n and thread ids 0. Timing points are cut to 3 per entry; version headers, counts, mods, ticks and star ratings are kept. Generation fails if an original md5 or player/cfg name appears."

